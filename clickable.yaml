clickable_minimum_required: "8.0.0"
framework: "ubuntu-sdk-20.04"
builder: "cmake"
qt_version: "5.12"
kill: instagraph
dependencies_target:
  - "gstreamer1.0-pulseaudio"
  - "gstreamer1.0-libav"
  - "gstreamer1.0-plugins-bad"
  - "gstreamer1.0-plugins-ugly"
  - "qml-module-qtquick-dialogs"
  - "qml-module-qtquick-controls"
image_setup:
  run:
    # Grant camera (video device) access in desktop mode
    - "usermod -aG video phablet"
# Avoid failing `clickable build` with warning: (NEEDS REVIEW) 'unconfined' not allowed
ignore_review_warnings: true
